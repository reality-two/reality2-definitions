sentant:
  name: Numbers API
  description: Get interesting facts about numbers using Numbers API

  plugins:
    - name: com.numbersapi
      url: http://numbersapi.com/__number__/trivia
      method: GET
      headers:
        Content-Type: text/plain
      output:
        key: number_fact
        event: number_response

  automations:
    - name: Number Facts Provider
      description: Provides interesting facts about numbers

      transitions:
        # Get fact for a specific number
        - event: "Get Number Fact"
          public: true
          parameters:
            number: string
          actions:
            - command: set
              parameters:
                key: requested_number
                value:
                  data: number

            - plugin: com.numbersapi
              command: send

        # Get random number fact
        - event: "Get Random Number Fact"
          public: true
          actions:
            - command: set
              parameters:
                key: requested_number
                value: "random"

            - plugin: com.numbersapi
              command: send

        # Process number fact response
        - event: number_response
          actions:
            - command: signal
              parameters:
                public: true
                event: "Number Fact Received"
                parameters:
                  number:
                    data: requested_number
                  fact:
                    data: number_fact
