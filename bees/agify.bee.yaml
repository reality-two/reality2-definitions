sentant:
  name: Agify
  description: Predict age from a person's name using Agify.io API

  plugins:
    - name: io.agify.api
      url: https://api.agify.io/?name=__name__
      method: GET
      headers:
        Content-Type: application/json
      output:
        key: age_data
        event: age_response

  automations:
    - name: Age Predictor
      description: Predicts age based on name

      transitions:
        # Get age prediction for a name
        - event: "Predict Age"
          public: true
          parameters:
            name: string
          actions:
            - plugin: io.agify.api
              command: send

        # Process age prediction response
        - event: age_response
          actions:
            - command: set
              parameters:
                key: name
                value:
                  jsonpath: age_data.name
            - command: set
              parameters:
                key: age
                value:
                  jsonpath: age_data.age
            - command: set
              parameters:
                key: count
                value:
                  jsonpath: age_data.count
            - command: signal
              parameters:
                public: true
                event: "Age Prediction"
                parameters:
                  name:
                    data: name
                  age:
                    data: age
                  count:
                    data: count
