sentant:
  name: Get UV
  description: Get a UV value
  plugins:
    - name: io.openuv.api
      description: Get UV settings from OpenUV
      url: https://api.openuv.io/api/v1/uv
      method: GET
      headers:
        x-access-token: __openuv_api_key__
      parameters:
        lat: __latitude__
        lng: __longitude__
      output:
        key: uv
        value: ''
        event: uv_out
  automations:
    - name: get_uv
      description: Get UV Settings
      transitions:
        - public: true
          event: Get UV
          actions:
            - command: send
              plugin: io.openuv.api
        - event: uv_out
          actions:
            - command: signal
              parameters:
                event: UV
                public: true
