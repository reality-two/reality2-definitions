# ------------------------------------------------------------------------------------------------------
# A Sentant to illustrate how a plugin to an external API can be used.  This uses WhatsApp Templates.
#
# Author: Dr. Roy C. Davies
# Date: 2025-08-31
# Contant: http://roycdavies.github.io
# ------------------------------------------------------------------------------------------------------

sentant:
  # ----------------------------------------------------------------------------------------------------
  # Sentant details
  # ----------------------------------------------------------------------------------------------------
  name: Send WhatsApp Message
  description: Send a Message using WhatsApp

  # ----------------------------------------------------------------------------------------------------
  # Plugins (A list, so begin with a dash)
  # ----------------------------------------------------------------------------------------------------
  plugins:
    - name: com.facebook.graph # This is the name of the plugin, used in the Automation below
      url: https://graph.facebook.com/v22.0/737679039436737/messages # This is the URL to the API endpoint
      method: POST # This is the HTTP method to use

      # These are the headers to send (see ChatGPT API documentation)
      headers:
        "Content-Type": "application/json"
        # This is a secret, so it is not shown here (replace before passing to Reality2)
        "Authorization": "Bearer __whatsapp_access_token__"

      # This is the body to send (see Meta Whatsapp API documentation).
      body:
        messaging_product: "whatsapp"
        to: "__phone_number__"
        type: "template"
        template:
          name: "simple_message"
          language:
            code: "en_US"
          components:
            - type: "body"
              parameters:
                - type: "text"
                  text: "__message__"

      # How to process the output from the API.  The value is a simplified JSON path expression.
      output:
        key: response
        value: ""
        event: whatsapp_response
  # ----------------------------------------------------------------------------------------------------

  # ----------------------------------------------------------------------------------------------------
  # Automations (Also a list, so begin with a dash)
  # ----------------------------------------------------------------------------------------------------
  automations:
    - name: WhatsApp # This is the name of the automation.
      description: This is a test automation for WhatsApp. # This is the description of the automation.
      transitions: # This is a list of transitions, so begin with a dash.
        # Send a message (question) to ChatGPT, initiated from an event.
        - event: "Send Message"
          parameters:
            message: string
          public: true
          actions:
            - plugin: com.facebook.graph
              command: send

          # Get the answer from ChatGPT and send out as a signal.
        - event: whatsapp_response
          actions:
            - command: set
              parameters:
                key: message
            - command: signal # sends a signal to subscribed clients
              public: true
              parameters:
                event: "WhatsApp Response"
  # ----------------------------------------------------------------------------------------------------
