sentant:
  name: Send TXT with Twilio
  description: description
  plugins:
    - name: com.twilio.api
      description: Send a TXT using Twilio
      url: >-
        https://api.twilio.com/2010-04-01/Accounts/__twilio_account__/Messages.json
      method: POST
      headers:
        Authorization: 'Basic __twilio_token__ '
        Content-Types: application/x-www-form-urlencoded
      body: To=%2B64277795294&From=%2B15024611693&Body=__message__
      output:
        key: result
        value: ''
        event: result
  automations:
    - name: name
      description: description
      transitions:
        - public: true
          event: Send Message
          parameters:
            message: string
          actions:
            - command: send
              plugin: com.twilio.api
        - event: result
          actions:
            - command: signal
              parameters:
                event: result
                public: true
