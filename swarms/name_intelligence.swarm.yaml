# ------------------------------------------------------------------------------------------------------
# Name Intelligence Swarm - Analyzes names using Agify, Genderize, and Nationalize APIs
#
# This swarm coordinates three API-based sentants to provide comprehensive name analysis:
# - Age prediction (Agify)
# - Gender prediction (Genderize)
# - Nationality prediction (Nationalize)
#
# The coordinator sentant collects results from all three sources and provides a unified response.
# ------------------------------------------------------------------------------------------------------
swarm:
  name: Name Intelligence
  description: Comprehensive name analysis combining age, gender, and nationality prediction from multiple APIs

  sentants:
    # --------------------------------------------------------------------------------------------------
    # Name Analysis Coordinator
    # --------------------------------------------------------------------------------------------------
    - name: Name Coordinator
      description: Coordinates name analysis requests across multiple prediction services

      data:
        analysis_name: ""
        age_result: null
        age_count: null
        gender_result: ""
        gender_probability: null
        gender_count: null
        country_id: ""
        nationality_probability: null
        responses_received: 0

      automations:
        - name: coordinator
          description: Manages the name analysis workflow

          transitions:
            # Receive analysis request and dispatch to all three services
            - event: "Analyze Name"
              public: true
              parameters:
                name: string
              actions:
                # Store the name being analyzed
                - command: set
                  parameters:
                    key: analysis_name
                    value:
                      data: name

                # Reset response counter
                - command: set
                  parameters:
                    key: responses_received
                    value: 0

                # Send requests to all three prediction services
                - command: send
                  parameters:
                    to: Agify
                    event: "Predict Age"
                    parameters:
                      name:
                        data: name

                - command: send
                  parameters:
                    to: Genderize
                    event: "Predict Gender"
                    parameters:
                      name:
                        data: name

                - command: send
                  parameters:
                    to: Nationalize
                    event: "Predict Nationality"
                    parameters:
                      name:
                        data: name

                - command: signal
                  parameters:
                    public: true
                    event: "Analysis Started"
                    parameters:
                      name:
                        data: analysis_name

            # Receive age prediction result
            - event: "Age Prediction"
              actions:
                - command: set
                  parameters:
                    key: age_result
                    value:
                      data: age

                - command: set
                  parameters:
                    key: age_count
                    value:
                      data: count

                - command: calculate
                  parameters:
                    key: responses_received
                    value: __responses_received__ + 1

                # Check if all responses received
                - command: send
                  parameters:
                    event: check_completion

            # Receive gender prediction result
            - event: "Gender Prediction"
              actions:
                - command: set
                  parameters:
                    key: gender_result
                    value:
                      data: gender

                - command: set
                  parameters:
                    key: gender_probability
                    value:
                      data: probability

                - command: set
                  parameters:
                    key: gender_count
                    value:
                      data: count

                - command: calculate
                  parameters:
                    key: responses_received
                    value: __responses_received__ + 1

                # Check if all responses received
                - command: send
                  parameters:
                    event: check_completion

            # Receive nationality prediction result
            - event: "Nationality Prediction"
              actions:
                - command: set
                  parameters:
                    key: country_id
                    value:
                      data: country_id

                - command: set
                  parameters:
                    key: nationality_probability
                    value:
                      data: probability

                - command: calculate
                  parameters:
                    key: responses_received
                    value: __responses_received__ + 1

                # Check if all responses received
                - command: send
                  parameters:
                    event: check_completion

            # Check if all responses have been received and emit combined result
            - event: check_completion
              actions:
                - command: check
                  parameters:
                    key: responses_received
                    operator: "=="
                    value: 3
                    true:
                      - command: signal
                        parameters:
                          public: true
                          event: "Complete Name Analysis"
                          parameters:
                            name:
                              data: analysis_name
                            age:
                              data: age_result
                            age_data_points:
                              data: age_count
                            gender:
                              data: gender_result
                            gender_probability:
                              data: gender_probability
                            gender_data_points:
                              data: gender_count
                            country:
                              data: country_id
                            nationality_probability:
                              data: nationality_probability
    # --------------------------------------------------------------------------------------------------
